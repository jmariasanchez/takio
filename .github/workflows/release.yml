name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Set up Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy

      - name: Require the tag to match all package versions
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          bash scripts/verify-release-version.sh "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release source
        run: |
          bun run build
          bun run check
          bun run test
          bun run test:performance:library
          bun run test:performance:native:library

  build:
    name: Build ${{ matrix.os }} CLI
    needs: version
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Set up Rust
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build checksummed executable
        run: bun run release:cli

      - name: Archive and smoke-test executable
        shell: bash
        run: |
          artifact="$(find dist/releases -maxdepth 1 -type f ! -name '*.sha256' -print -quit)"
          test -n "$artifact"
          env -i PATH=/usr/bin:/bin "$artifact" capabilities
          (cd dist/releases && shasum -a 256 --check ./*.sha256)

          archive="${artifact}.tar.gz"
          artifact_name="$(basename "$artifact")"
          archive_name="$(basename "$archive")"
          tar -czf "$archive" -C dist/releases "$artifact_name"
          (cd dist/releases && shasum -a 256 "$archive_name" > "${archive_name}.sha256")
          rm -- "$artifact" "${artifact}.sha256"

          extraction_directory="$(mktemp -d "${RUNNER_TEMP}/takio-cli.XXXXXX")"
          trap 'rm -rf -- "$extraction_directory"' EXIT
          tar -xzf "$archive" -C "$extraction_directory"
          test -x "$extraction_directory/$artifact_name"
          env -i PATH=/usr/bin:/bin "$extraction_directory/$artifact_name" capabilities
          (cd dist/releases && shasum -a 256 --check ./*.sha256)

      - name: Upload executable archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takio-cli-${{ matrix.os }}
          path: |
            dist/releases/*.tar.gz
            dist/releases/*.tar.gz.sha256
          if-no-files-found: error

  desktop-macos:
    name: Build signed and notarized macOS desktop app
    needs: version
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Set up Rust
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Check native application
        run: bun run check:native:macos

      - name: Import Developer ID certificate
        if: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
        uses: apple-actions/import-codesign-certs@7abe6dfe88f6bf6b1fa06e6a5704a2605d897418 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build desktop app with the native Rust sidecar
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" && -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            echo "Apple signing and notarization credentials are present. Building distribution DMG."
          else
            echo "Apple signing and notarization credentials are absent. Building unsigned local DMG and skipping distribution-only gates truthfully."
          fi
          if [[ -z "${CSC_NAME:-}" ]]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          bun run --filter '@takio/desktop' package

      - name: Verify distribution bundle
        if: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        shell: bash
        run: |
          bash scripts/verify-macos-bundle.sh --distribution apps/desktop/release/mac-arm64/Takio.app
          xcrun stapler validate apps/desktop/release/*.dmg

      - name: Verify local unsigned bundle
        if: ${{ !(secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '') }}
        shell: bash
        run: |
          bash scripts/verify-macos-bundle.sh apps/desktop/release/mac-arm64/Takio.app
          echo "Skipped distribution signing, notarization, stapler, and Gatekeeper gates because Apple credentials were not provided."

      - name: Checksum notarized DMG
        shell: bash
        run: |
          cd apps/desktop/release
          shasum -a 256 ./*.dmg > Takio.dmg.sha256

      - name: Upload notarized DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takio-desktop-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.sha256
          if-no-files-found: error

  publish:
    name: Create draft GitHub release
    needs: [build, desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: takio-*
          path: dist/releases
          merge-multiple: true

      - name: Verify release asset inventory and checksums
        shell: bash
        run: |
          test "$(find dist/releases -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6
          test "$(find dist/releases -maxdepth 1 -type f -name '*.sha256' | wc -l | tr -d ' ')" = 3
          (cd dist/releases && sha256sum --check ./*.sha256)

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/releases/* --draft --generate-notes --verify-tag
