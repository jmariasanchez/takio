name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} CLI
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require the tag to match package.json
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(bun -p 'require("./package.json").version')"

      - name: Build checksummed executable
        run: bun run release:cli

      - name: Smoke-test executable and checksum
        shell: bash
        run: |
          artifact="$(find dist/releases -maxdepth 1 -type f ! -name '*.sha256' -print -quit)"
          test -n "$artifact"
          env -i PATH=/usr/bin:/bin "$artifact" capabilities
          (cd dist/releases && shasum -a 256 --check ./*.sha256)

      - name: Upload executable and checksum
        uses: actions/upload-artifact@v4
        with:
          name: takio-cli-${{ matrix.os }}
          path: dist/releases/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: takio-cli-*
          path: dist/releases
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/releases/* --generate-notes --verify-tag
