name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-cli:
    name: Reusable Bun packages and Rust CLI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Rust
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: bun install --frozen-lockfile
      - name: Reject disabled or focused tests except explicit external/performance gates
        run: |
          if git grep -nE '(describe|test|it)\.(skip|todo|only)[[:space:]]*\(' -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs'; then
            echo 'Committed test skip, todo, or only markers are not allowed.' >&2
            exit 1
          fi
          ignored="$(git grep -nE '#\[ignore([^]]*)?\]' -- '*.rs' || true)"
          unexpected="$(printf '%s\n' "$ignored" | grep -vE '^(apps/engine/src/library/store.rs:[0-9]+:    #\[ignore = "release performance report, not a wall-clock correctness gate"\]|apps/engine/src/import/scan.rs:[0-9]+:    #\[ignore = "release microbenchmark using generated temporary files"\]|apps/cli/tests/pdf_metadata.rs:[0-9]+:#\[ignore = "requires independent local Poppler pdfinfo oracle"\])$' | grep -v '^$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected ignored Rust tests:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          oracle_reason='#[ignore = "requires independent local Poppler pdfinfo oracle"]'
          test "$(grep -Fc "$oracle_reason" apps/cli/tests/pdf_metadata.rs)" = 1
          grep -A 1 -Fx "$oracle_reason" apps/cli/tests/pdf_metadata.rs | grep -Fx 'fn synthetic_pdf_metadata_matches_poppler_oracle() {'
      - run: bun run build
      - run: bun run check
      - run: bun run test
      - name: Verify PDF metadata against independent Poppler oracle
        run: |
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y poppler-utils
          fi
          pdfinfo -v
          cargo test -p takio --test pdf_metadata synthetic_pdf_metadata_matches_poppler_oracle -- --ignored --exact
      - name: Release script regression tests
        run: |
          bash scripts/test-verify-macos-bundle.sh
          bash scripts/test-release-scripts.sh
      - name: Library performance gates
        run: |
          bun run test:performance:library
          bun run test:performance:native:library
      - name: Package and smoke-test standalone CLI
        run: |
          bun run release:cli
          artifact="$(find dist/releases -maxdepth 1 -type f ! -name '*.sha256' -print -quit)"
          test -n "$artifact"
          env -i PATH=/usr/bin:/bin "$artifact" capabilities
          (cd dist/releases && sha256sum --check ./*.sha256)
      - run: git diff --check

  native-macos:
    name: Native GPUI macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Rust
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: bun install --frozen-lockfile
      - name: Require Apple Silicon and Metal shader toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -downloadComponent MetalToolchain
      - run: bun run check:native:macos
      - name: Enforce native desktop startup budgets
        run: bash scripts/bench-desktop-native.sh
      - name: Package, verify and smoke-launch local native app and DMG
        run: bun run package:macos
      - name: Upload local-only DMG and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: takio-native-macos-local-only
          path: |
            dist/releases/*-local.dmg
            dist/releases/*-local.dmg.sha256
          if-no-files-found: error

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Rust
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: bun install --frozen-lockfile
      - run: bun audit
