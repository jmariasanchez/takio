name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bun:
    name: Bun workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject disabled or focused tests
        shell: bash
        run: |
          if git grep -nE '(describe|test|it)\.(skip|todo|only)[[:space:]]*\(' -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs'; then
            echo 'Committed test skip, todo, or only markers are not allowed.' >&2
            exit 1
          fi
          if git grep -nE '#\[ignore([^]]*)?\]' -- '*.rs'; then
            echo 'Committed ignored Rust tests are not allowed.' >&2
            exit 1
          fi

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check whitespace
        run: git diff --check
