[package]
name = "takio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first ebook library CLI and terminal UI"

[[bin]]
name = "takio"
path = "src/main.rs"

[dependencies]
takio = { workspace = true, features = ["cli-signals"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
ratatui = "0.29"
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
uuid.workspace = true

[dev-dependencies]
flate2.workspace = true
hex.workspace = true
rusqlite.workspace = true
sha2.workspace = true
tempfile.workspace = true
takio = { workspace = true, features = ["test-support"] }
assert_cmd = "2.0"
predicates = "3.1"

[lints]
workspace = true
