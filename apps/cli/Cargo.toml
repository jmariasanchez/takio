[package]
name = "takio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first ebook library CLI and terminal UI"

[[bin]]
name = "takio"
path = "src/main.rs"

[dependencies]
takio = { package = "takio-engine", path = "../engine" }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
tiny_http = "0.12"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
flate2 = "1.1"
hex = "0.4"
rusqlite = { version = "0.37", features = ["backup", "bundled", "serialize"] }
sha2 = "0.10"
tempfile = "3.20"
takio = { package = "takio-engine", path = "../engine", features = ["test-support"] }
assert_cmd = "2.0"
predicates = "3.1"

[lints]
workspace = true
