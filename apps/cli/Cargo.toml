[package]
name = "takio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first ebook library CLI and terminal UI"

[[bin]]
name = "takio"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
crossterm = "0.29"
directories = "6.0"
fs2 = "0.4"
hex = "0.4"
ratatui = "0.29"
regex = "1.11"
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["backup", "bundled", "serialize"] }
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.4"
tempfile = "3.20"
thiserror = "2.0"
tiny_http = "0.12"
unicode-normalization = "0.1"
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[lints]
workspace = true
