[package]
name = "takio-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native GPUI desktop for the Takio ebook library"
publish = false

[[bin]]
name = "takio-desktop"
path = "src/main.rs"

[dependencies]
takio = { path = "../cli" }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["font-kit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.20"

# font-kit must be enabled on the platform crate or macOS installs a no-op
# text system and renders no text. Linux additionally needs a windowing
# backend.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "wayland", "x11"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["font-kit", "test-support"] }

[lints]
workspace = true
