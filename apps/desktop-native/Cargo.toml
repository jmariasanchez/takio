[package]
name = "takio-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native GPUI desktop for the Takio ebook library"
publish = false

[[bin]]
name = "takio-desktop"
path = "src/main.rs"

[dependencies]
takio.workspace = true
gpui.workspace = true
# Declare our codecs explicitly even though GPUI unifies additional image features.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
tempfile.workspace = true

# font-kit must be enabled on the platform crate or macOS installs a no-op
# text system and renders no text. Linux additionally needs a windowing
# backend.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[features]
# Opt-in offscreen render of the real workspace to a PNG via Metal, for acceptance
# evidence without Screen Recording. Not enabled in packaged builds.
snapshot = ["gpui/test-support", "gpui_platform/test-support"]

[lints]
workspace = true
