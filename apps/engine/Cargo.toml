[package]
name = "takio-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first ebook library engine"

[lib]
name = "takio"

[features]
test-support = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
flate2 = "1.1"
hex = "0.4"
lopdf = { version = "0.46", default-features = false }
regex = "1.11"
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["backup", "bundled", "serialize"] }
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3.20"
thiserror = "2.0"
unicode-normalization = "0.1"
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"

[lints]
workspace = true
