[workspace]
members = ["apps/engine", "apps/cli", "apps/desktop-native"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/1jehuang/takio"

[workspace.dependencies]
takio = { package = "takio-engine", path = "apps/engine" }
flate2 = "1.1"
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["font-kit"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit"] }
hex = "0.4"
rusqlite = { version = "0.37", features = ["backup", "bundled", "serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
signal-hook = "0.4"
tempfile = "3.20"
uuid = { version = "1.18", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Release builds favour a small, fast standalone binary. Unwinding is kept so
# Drop guards (terminal restoration, partial-file cleanup) still run on panic.
# Level 2 avoids level 3's measured code growth. Size and latency gates still apply.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 2
strip = "symbols"

# PDF metadata parsing is off the interactive query path. Keep its general-purpose
# parser compact without removing supported inputs or changing allocation limits.
[profile.release.package.lopdf]
opt-level = "z"

# Keep the shared engine within the native bundle's existing size budget.
# This retains loop vectorization while preferring compact library code.
[profile.release.package.takio-engine]
opt-level = "s"
