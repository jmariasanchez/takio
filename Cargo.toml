[workspace]
members = ["apps/cli", "apps/desktop-native"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/1jehuang/takio"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Release builds favour a small, fast standalone binary. Unwinding is kept so
# Drop guards (terminal restoration, partial-file cleanup) still run on panic.
# Level 2 avoids level 3's measured code growth. Size and latency gates still apply.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 2
strip = "symbols"

# PDF metadata parsing is off the interactive query path. Keep its general-purpose
# parser compact without removing supported inputs or changing allocation limits.
[profile.release.package.lopdf]
opt-level = "z"
